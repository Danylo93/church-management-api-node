name: CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Roda nas mudanças na branch 'master'
  pull_request:
    branches:
      - master  # Roda para Pull Requests na branch 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.20.0'

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build the project
      run: npm run build

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        sudo docker build -t dan1993/api-church:latest .
        sudo docker tag dan1993/api-church:latest dan1993/api-church:${{ github.sha }}
        sudo docker push dan1993/api-church:latest
        sudo docker push dan1993/api-church:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@<SEU_IP_EC2> << 'EOF'
          sudo docker pull dan1993/api-church:latest
          sudo docker stop api-church || true
          sudo docker rm api-church || true
          sudo docker run -d -p 3000:3000 --name api-church dan1993/api-church:latest
        EOF
