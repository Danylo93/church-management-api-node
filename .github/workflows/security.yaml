name: Security

on:
  schedule:
    - cron: '0 3 * * *' # Diariamente 03h
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Docker Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dan1993/church-api:latest
