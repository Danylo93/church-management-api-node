replicaCount: 3

image:
  repository: dan1993/church-api
  pullPolicy: IfNotPresent
  tag: "sha123abc"  # Atualizado pelo pipeline CD

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.igrejaviva.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: church-api-tls
      hosts:
        - api.igrejaviva.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: NODE_ENV
    value: "production"
