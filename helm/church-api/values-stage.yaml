replicaCount: 2

image:
  repository: dan1993/church-api
  pullPolicy: IfNotPresent
  tag: "stage"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: stage.api.igrejaviva.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: church-api-stage-tls
      hosts:
        - stage.api.igrejaviva.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

env:
  - name: NODE_ENV
    value: "staging"
