name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "feature/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # - name: Lint
      #   run: npm run lint

      # - name: Run Tests
      #   run: npm run test:ci
